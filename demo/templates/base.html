{% load static %}<!doctype html>
<html lang="en" data-theme="insights">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demo{% endblock %} · My Insights demo</title>
  <link href="{% static 'css/tailwind.css' %}?v={{ css_version }}" rel="stylesheet">
  <script src="{% static 'vendor/htmx-2.0.6.min.js' %}"></script>
  <link href="{% static 'django_datatable/datatable.css' %}" rel="stylesheet">
  <script defer src="{% static 'django_datatable/datatable.js' %}"></script>
  {% block extra_head %}{% endblock %}
  <script defer src="{% static 'vendor/alpine-3.14.9.min.js' %}"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="min-h-screen bg-base-200">
  <header class="navbar border-b border-base-300 bg-base-100 px-4 sm:px-6">
    <a href="/" class="font-semibold tracking-tight">Host app <span class="font-normal text-base-content/50">· demo</span></a>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
