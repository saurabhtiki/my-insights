[project]
name = "my-insights"
version = "0.1.0"
description = "Reusable Django add-on: upload CSV/Excel and explore it in memory (DuckDB)."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-datatable",
    "duckdb>=1.2",
    "python-calamine>=0.3",
    "psutil>=6.0",
    "fsspec>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "waitress>=3.0",
    "whitenoise>=6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_insights"]

[tool.uv.sources]
django-datatable = { git = "https://github.com/saurabhtiki/django-datatable" }

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "demo.settings.pytest"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"demo/settings/*.py" = ["F403", "F405"]
